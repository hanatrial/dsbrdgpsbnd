<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard MPO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --bg2:#eceef2; --surface:#ffffff; --shell:#ffffff;
    --border:rgba(20,22,30,.07); --border-soft:rgba(20,22,30,.045);
    --text:#14161d; --sub:#767a87; --accent:#4b3df6; --accent-ink:#ffffff;
    --good:#1a9c6d; --good-bg:#e3f7ee; --warn:#b9790a; --warn-bg:#fdf1dd;
    --danger:#d8433a; --danger-bg:#fbe9e7;
    --shadow-sm:0 1px 2px rgba(15,15,25,.04), 0 1px 1px rgba(15,15,25,.03);
    --shadow-md:0 16px 40px -12px rgba(20,22,40,.14), 0 4px 10px -4px rgba(20,22,40,.06);
    --shadow-lg:0 30px 70px -20px rgba(20,22,40,.22), 0 10px 24px -8px rgba(20,22,40,.10);
    --ease:cubic-bezier(0.32,0.72,0,1);
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1100px 480px at 8% -8%, rgba(75,61,246,.07), transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(26,156,109,.06), transparent 55%),
      var(--bg);
    color:var(--text);letter-spacing:-.01em;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em;}
  .wrap{max-width:1340px;margin:0 auto;padding:28px 20px 90px;}

  /* ---------- Header ---------- */
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px;padding:4px 4px 4px 6px;}
  .brand-eyebrow{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;background:rgba(75,61,246,.08);color:var(--accent);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;margin-bottom:10px;}
  .brand-eyebrow::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(75,61,246,.15);}
  h1{font-size:25px;margin:0;font-weight:700;color:var(--text);}
  .sub{color:var(--sub);font-size:13px;margin-top:5px;font-weight:500;}

  .toggle{display:flex;background:var(--shell);border:1px solid var(--border);border-radius:999px;padding:5px;gap:3px;box-shadow:var(--shadow-sm);}
  .toggle button{border:none;background:transparent;color:var(--sub);padding:10px 22px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .5s var(--ease);}
  .toggle button:hover{color:var(--text);}
  .toggle button.active{background:var(--text);color:#fff;box-shadow:var(--shadow-sm);}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;}
  .tabs button{background:var(--surface);border:1px solid var(--border);color:var(--sub);padding:9px 17px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .45s var(--ease);box-shadow:var(--shadow-sm);}
  .tabs button:hover{transform:translateY(-1px);color:var(--text);border-color:rgba(20,22,30,.14);}
  .tabs button.active{background:var(--text);color:#fff;border-color:var(--text);box-shadow:var(--shadow-md);}
  .tabs button.tab-performance{border-color:var(--accent);color:var(--accent);font-weight:700;margin-left:6px;}
  .spg-store-select{max-width:130px;width:130px;font-size:12px;}
  .spg-q-cell{background:rgba(125,108,255,.06);}

  .tabs button.tab-performance.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---------- Cards (Bento) ---------- */
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px;}
  .card{
    grid-column:span 2;position:relative;overflow:hidden;
    background:linear-gradient(180deg, rgba(20,22,30,.03), rgba(20,22,30,0) 40%), var(--shell);
    border:1px solid var(--border);border-radius:22px;padding:8px;box-shadow:var(--shadow-sm);
    transition:transform .5s var(--ease), box-shadow .5s var(--ease);
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .card-inner{background:var(--surface);border-radius:16px;padding:18px 18px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);height:100%;}
  .card .label{font-size:10.5px;color:var(--sub);margin-bottom:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:700;}
  .card .value{font-size:23px;font-weight:700;font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .card .value.good{color:var(--good);}
  @media (max-width:980px){ .card{grid-column:span 3;} }
  @media (max-width:640px){ .cards{grid-template-columns:1fr 1fr;gap:10px;} .card{grid-column:span 1;} }

  /* ---------- Table shell (double bezel) ---------- */
  .table-shell{background:rgba(20,22,30,.035);border:1px solid var(--border-soft);border-radius:26px;padding:8px;box-shadow:var(--shadow-sm);}
  .table-scroll{overflow-x:auto;border-radius:20px;background:var(--surface);box-shadow:inset 0 1px 1px rgba(255,255,255,.7);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
  thead th{background:transparent;color:var(--sub);text-align:left;padding:14px 14px;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;border-bottom:1px solid var(--border);}
  tbody td{padding:11px 14px;border-top:1px solid var(--border-soft);}
  tbody tr{transition:background .3s var(--ease);}
  tbody tr:hover{background:rgba(75,61,246,.035);}
  td input{background:transparent;border:1px solid transparent;color:var(--text);width:100%;min-width:90px;padding:5px 7px;border-radius:8px;font-size:13px;font-family:inherit;}
  td input:focus{border-color:var(--accent);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(75,61,246,.12);}
  td input.target-input{font-weight:700;color:var(--warn);}
  .target-view{font-weight:700;color:var(--warn);margin-right:6px;font-variant-numeric:tabular-nums;}

  /* ---------- Strata selector (tier ladder) ---------- */
  .strata{position:relative;display:flex;flex-direction:column;gap:6px;min-width:138px;padding:6px 9px 7px;border-radius:13px;
    border:1px solid var(--border);background:var(--surface);cursor:pointer;
    transition:border-color .4s var(--ease), box-shadow .4s var(--ease), transform .4s var(--ease);}
  .strata:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(75,61,246,.09);transform:translateY(-1px);}
  .strata select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;}
  .strata-top{display:flex;align-items:center;justify-content:space-between;gap:9px;}
  .strata-val{font-weight:700;color:var(--warn);font-variant-numeric:tabular-nums;font-size:12.5px;letter-spacing:-.01em;}
  .strata-val.zero{color:var(--sub);font-weight:600;}
  .strata-chip{font-size:9px;font-weight:800;letter-spacing:.07em;padding:2px 7px;border-radius:999px;
    background:var(--bg2);color:var(--sub);white-space:nowrap;transition:all .4s var(--ease);}
  .strata-chip.hit{background:var(--good-bg);color:var(--good);}
  .strata-ladder{display:flex;gap:3px;}
  .strata-ladder i{flex:1;height:4px;border-radius:2px;background:var(--bg2);transition:background .5s var(--ease);}
  .strata-ladder i.earned{background:linear-gradient(90deg,var(--good),#35c48d);}
  .strata-ladder i.toward{background:linear-gradient(90deg,var(--accent),#7d6cff);opacity:.45;}
  .strata-na{color:var(--sub);font-size:12px;font-weight:600;}
  .strata-mini{display:inline-flex;flex-direction:column;gap:4px;align-items:stretch;min-width:56px;}
  .mult-badge{display:inline-block;padding:1px 6px;border-radius:999px;background:linear-gradient(90deg,var(--accent),#7d6cff);color:#fff;font-size:10px;font-weight:800;letter-spacing:.02em;vertical-align:middle;}
  .strata-mini .strata-ladder i{height:3px;}
  .edit-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:7px;transition:background .3s var(--ease);}
  .edit-btn:hover{background:rgba(75,61,246,.1);}

  /* ---------- Import panel ---------- */
  .import-panel{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;background:var(--shell);border:1px solid var(--border);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow-sm);}
  .import-toggle{display:flex;gap:3px;background:var(--bg2);border-radius:999px;padding:4px;}
  .import-toggle button{border:none;background:transparent;color:var(--sub);padding:7px 15px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;transition:all .4s var(--ease);}
  .import-toggle button.active{background:var(--text);color:#fff;}
  #importFile{display:none;}
  .import-btn{margin:0;}
  .import-status{font-size:12px;color:var(--sub);font-weight:500;}
  .import-status.ok{color:var(--good);font-weight:700;}
  .import-status.err{color:var(--danger);font-weight:700;}
  .month-select{border:1px solid var(--border);background:var(--bg2);color:var(--text);padding:9px 12px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .quarter-hint{font-size:11.5px;color:var(--sub);background:rgba(75,61,246,.06);border:1px solid rgba(75,61,246,.14);border-radius:14px;padding:9px 14px;margin:-4px 0 16px;font-weight:600;}
  .quarter-hint b{color:var(--accent);font-weight:700;}

  .pct-bar{width:56px;height:5px;background:var(--bg2);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:7px;}
  .pct-fill{height:100%;background:linear-gradient(90deg, var(--accent), #7d6cff);border-radius:4px;transition:width .6s var(--ease);}
  .badge{padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:700;display:inline-block;letter-spacing:.01em;}
  .badge.good{background:var(--good-bg);color:var(--good);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--danger-bg);color:var(--danger);}
  tfoot td{padding:13px 14px;font-weight:700;border-top:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;}
  .col-name{min-width:220px;}

  /* ---------- Buttons (island / pill, button-in-button) ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:9px 9px 9px 18px;border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:700;font-family:inherit;
    transition:transform .35s var(--ease), box-shadow .35s var(--ease); box-shadow:var(--shadow-sm);
  }
  .btn:hover{box-shadow:var(--shadow-md);}
  .btn:active{transform:scale(.98);}
  .btn .btn-icon{width:26px;height:26px;border-radius:50%;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:transform .35s var(--ease);}
  .btn:hover .btn-icon{transform:translate(1px,-1px) scale(1.06);background:var(--accent);color:#fff;}
  .btn.green{background:var(--text);border-color:var(--text);color:#fff;padding:9px 18px;}

  tbody tr.clickable{cursor:pointer;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,16,24,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .4s var(--ease);}
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-box{
    background:rgba(20,22,30,.04);border:1px solid var(--border-soft);border-radius:30px;padding:8px;
    max-width:660px;width:100%;max-height:84vh;box-shadow:var(--shadow-lg);
    transform:translateY(18px) scale(.98);opacity:0;transition:all .5s var(--ease);
  }
  .modal-overlay.open .modal-box{transform:translateY(0) scale(1);opacity:1;}
  .modal-box-inner{background:var(--surface);border-radius:24px;padding:26px 26px 24px;max-height:calc(84vh - 16px);overflow-y:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  .modal-box h2{margin:0 0 2px;font-size:18px;font-weight:700;}
  .modal-box .modal-sub{color:var(--sub);font-size:12px;margin-bottom:18px;font-weight:500;}
  .modal-close{float:right;background:var(--bg2);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--sub);cursor:pointer;line-height:1;transition:all .35s var(--ease);}
  .modal-close:hover{background:var(--text);color:#fff;transform:rotate(90deg);}
  .modal-section{margin-bottom:18px;}
  .modal-section h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--sub);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--border);font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;}
  .modal-item-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;gap:10px;}
  .modal-item-row .iname{color:var(--text);}
  .modal-item-row .ival{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .modal-subtotal{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-top:8px;margin-top:4px;border-top:1px dashed var(--border);}
  .modal-empty{color:var(--sub);font-size:13px;font-style:italic;padding:6px 0;}
  .modal-grandtotal{display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding-top:14px;margin-top:10px;border-top:1px solid var(--border);font-family:'Space Grotesk',sans-serif;}

  .modal-box.wide{max-width:780px;}
  table.summary-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.summary-table thead th{background:transparent;color:var(--sub);text-align:right;padding:8px 9px;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);}
  table.summary-table thead th:first-child{text-align:left;}
  table.summary-table tbody td{padding:8px 9px;border-bottom:1px solid var(--border-soft);}
  table.summary-table tbody tr:last-child td{border-bottom:none;}
  .sm-cat{font-weight:700;color:var(--text);white-space:nowrap;}
  .sm-num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .sm-actual{font-weight:700;color:var(--warn);}
  .sm-gap-neg{color:var(--danger);}
  .sm-gap-pos{color:var(--good);}
  .sm-pct{text-align:right;}

  /* ---------- Scroll-in reveal ---------- */
  .reveal{opacity:0;transform:translateY(18px);filter:blur(6px);transition:opacity .8s var(--ease), transform .8s var(--ease), filter .8s var(--ease);}
  .reveal.in{opacity:1;transform:translateY(0);filter:blur(0);}
</style>
</head>
<body>
<div class="wrap">
  <header class="reveal">
    <div>
      <div class="brand-eyebrow">Nutrifood &middot; Modern Trade</div>
      <h1>Dashboard MPO</h1>
      <div class="sub" id="subtitle">Makassar &middot; ALL</div>
    </div>
    <div class="toggle">
      <button id="btn-makassar" class="active" onclick="switchRegion('makassar')">Makassar</button>
      <button id="btn-kendari" onclick="switchRegion('kendari')">Kendari</button>
    </div>
  </header>

  <div class="tabs reveal" id="tabs"></div>

  <div class="cards reveal" id="cards"></div>

  <div class="import-panel reveal">
    <div class="import-toggle">
      <button id="src-bsp" class="active" onclick="switchImportSource('bsp')">BSP</button>
      <button id="src-bcp" onclick="switchImportSource('bcp')">BCP</button>
      <button id="src-matakar" onclick="switchImportSource('matakar')">MATAKAR</button>
    </div>
    <select id="importMonth" class="month-select" onchange="switchImportMonth(this.value)" title="Data hasil import akan dicatat untuk bulan ini"></select>
    <input type="file" id="importFile" accept=".xlsx,.xls,.xlsb,.csv" onchange="handleImportFile(event)">
    <label for="importFile" class="btn import-btn">Import file <span class="btn-icon">&#8593;</span></label>
    <button class="btn" onclick="resetChannelsToZero()">Reset ke 0 <span class="btn-icon">&#8635;</span></button>
    <span class="import-status" id="importStatus"></span>
  </div>
  <div class="quarter-hint reveal" id="quarterHint"></div>

  <div class="table-shell reveal">
    <div class="table-scroll">
      <table>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <div class="modal-box-inner">
      <button class="modal-close" onclick="closeModal()">&#10005;</button>
      <h2 id="modalTitle"></h2>
      <div class="modal-sub" id="modalSub"></div>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   KONFIGURASI KATEGORI PER REGION
   ch1Label / ch2Label = label channel (BSP/BCP di Makassar,
   MATAKAR/BCP di Kendari). Kategori tanpa channel split
   cukup pakai target + juni (actual) + gap.
   ========================================================= */
const REGION_CHANNELS = {
  makassar: { ch1: 'BSP', ch2: 'BCP' },
  kendari:  { ch1: 'MATAKAR', ch2: 'BCP' }
};

const CATEGORIES = [
  { key:'all',     label:'ALL',      target:'Target All' },
  { key:'oil',     label:'OIL',      target:'Target Minyak' },
  { key:'porang',  label:'PORANG',   target:'Target B Porang' },
  { key:'platinum',label:'PLATINUM', target:'Target Platinum' },
  { key:'milk',    label:'MILK (Diabetix) / SUDIA', target:'Target Milk Diabetix / Sudia' },
  { key:'school',  label:'SCHOOL',   target:'Target School' },
  { key:'teen',    label:'TEEN',     target:'Target Teen' },
  { key:'nspolos', label:'NS POLOS', target:'Target NS Polos' },
  { key:'granola', label:'GRANOLA/MOONLIGHT/CLEAR PROTEIN', target:'Target Granola/Moonlight/Clear Protein' }
];
// Semua kategori sekarang seragam: target, ch1 (BSP/MATAKAR), ch2 (BCP). Total = ch1+ch2.

/* ============== SKEMA INSENTIF SPG (per Agustus 2026) ==============
   Sumber: "Skema Insentif SPG per Agustus 2026.xlsx", sheet "Skema Insentif SPG Sem 2 (agt)".
   Tier bulanan per kategori: { threshold: capaian sell-in/bulan, incentive: Rp insentif SPG }.
   Insentif yang didapat = tier tertinggi yang sudah tercapai (actual >= threshold). */
const INCENTIVE_SCHEME = {
  school:  [ {threshold:10000000, incentive:200000}, {threshold:20000000, incentive:300000}, {threshold:25000000, incentive:400000}, {threshold:40000000, incentive:600000} ],
  teen:    [ {threshold:15000000, incentive:200000}, {threshold:20000000, incentive:300000}, {threshold:40000000, incentive:400000} ],
  platinum:[ {threshold:8000000,  incentive:300000}, {threshold:10000000, incentive:400000}, {threshold:15000000, incentive:500000} ],
  granola: [ {threshold:2000000,  incentive:200000}, {threshold:4000000,  incentive:400000}, {threshold:8000000,  incentive:800000} ],
  porang:  [ {threshold:4000000,  incentive:100000}, {threshold:8000000,  incentive:300000}, {threshold:12000000, incentive:750000}, {threshold:25000000, incentive:1000000}, {threshold:50000000, incentive:1500000}, {threshold:75000000, incentive:3000000}, {threshold:100000000,incentive:4000000} ],
  milk:    [ {threshold:2500000,  incentive:100000}, {threshold:5000000,  incentive:200000}, {threshold:10000000, incentive:500000} ], // tier Sudia, digabung ke kategori Milk (Diabetix)
  oil:     [ {threshold:12000000, incentive:100000}, {threshold:17000000, incentive:200000}, {threshold:30000000, incentive:400000}, {threshold:60000000, incentive:1000000}, {threshold:70000000, incentive:2000000}, {threshold:80000000, incentive:2500000}, {threshold:100000000,incentive:3000000} ]
};

/* Tier Quarter (Feb-Apr / Mei-Jul / Ags-Okt 2026) — hanya tersedia untuk 4 kategori ini di skema.
   Karena dashboard belum punya field actual terpisah per-quarter, tier ini dihitung dari
   actual (ch1+ch2) yang sama dengan yang dipakai tier Bulanan. */
const QUARTER_INCENTIVE_SCHEME = {
  school:  [ {threshold:120000000, incentive:700000} ],
  teen:    [ {threshold:120000000, incentive:700000} ],
  platinum:[ {threshold:20000000, incentive:400000}, {threshold:60000000, incentive:700000}, {threshold:90000000, incentive:1500000} ],
  porang:  [ {threshold:30000000, incentive:500000}, {threshold:50000000, incentive:1200000}, {threshold:100000000, incentive:2000000}, {threshold:200000000, incentive:3000000} ]
};

function calcIncentiveTiers(tiers, actual){
  if(!tiers) return 0;
  let earned = 0;
  tiers.forEach(t => { if(actual >= t.threshold) earned = t.incentive; });
  return earned;
}

function calcIncentive(catKey, actual, scheme){
  return calcIncentiveTiers((scheme || INCENTIVE_SCHEME)[catKey], actual);
}

/* ============== MULTIPLIER INSENTIF KHUSUS PER OUTLET ==============
   Beberapa toko punya kesepakatan pengali tersendiri di luar skema standar —
   BUKAN cuma nilai insentif Rp-nya yang dikalikan, TARGET (tier threshold) buat
   naik strata juga ikut dikalikan sama besar (target lebih berat, payout lebih
   besar, konsisten satu sama lain):
     - SATU SAMA JAYA ABADI PT (Landak)         → x2
     - SATU SAMA JAYA ABADI PERINTIS  PT        → x1.5
     - SATU SAMA JAYA ABADI HERTASNING  PT      → x1.5
   Berlaku untuk skema Bulanan maupun Quarter. */
const OUTLET_INCENTIVE_MULTIPLIER = {
  "SATU SAMA JAYA ABADI PT": 2,
  "SATU SAMA JAYA ABADI PERINTIS  PT": 1.5,
  "SATU SAMA JAYA ABADI HERTASNING  PT": 1.5
};

function outletMultiplier(toko){
  return OUTLET_INCENTIVE_MULTIPLIER[toko] || 1;
}

// Tier efektif untuk outlet tsb: threshold DAN incentive-nya sudah dikalikan
// pengali outlet (kalau ada). Untuk outlet biasa (mult=1) sama persis dengan skema asli.
function tiersForOutlet(catKey, scheme, toko){
  const tiers = scheme[catKey];
  if(!tiers) return null;
  const mult = outletMultiplier(toko);
  if(mult === 1) return tiers;
  return tiers.map(t => ({ threshold: Math.round(t.threshold * mult), incentive: Math.round(t.incentive * mult) }));
}

/* ============== NS POLOS: insentif flat per-target-outlet ==============
   Beda dari kategori lain: NS Polos tidak punya tier bersama untuk semua toko.
   Tiap toko punya target sendiri-sendiri (hasil analisa "Average YTD 2026" per
   outlet, dibulatkan). Kalau actual >= target toko itu, dapat insentif flat
   Rp 150.000 (dikalikan pengali outlet kalau ada, sama seperti kategori lain). */
const NSPOLOS_INCENTIVE_FLAT = 150000;

function calcNsPolosIncentive(row){
  const c = row.nspolos;
  if(!c) return 0;
  const target = num(c.target);
  if(target <= 0) return 0;
  const actual = num(c.ch1) + num(c.ch2);
  return actual >= target ? NSPOLOS_INCENTIVE_FLAT * outletMultiplier(row.toko) : 0;
}

function calcRowIncentive(row, catKey, scheme){
  const s = scheme || INCENTIVE_SCHEME;
  if(catKey === 'all'){
    return Object.keys(s).reduce((sum, key) => {
      const c = row[key];
      if(!c) return sum;
      return sum + calcIncentiveTiers(tiersForOutlet(key, s, row.toko), num(c.ch1) + num(c.ch2));
    }, 0) + calcNsPolosIncentive(row);
  }
  if(catKey === 'nspolos') return calcNsPolosIncentive(row);
  const c = row[catKey];
  if(!c || !s[catKey]) return 0;
  return calcIncentiveTiers(tiersForOutlet(catKey, s, row.toko), num(c.ch1) + num(c.ch2));
}

/* ============== PERIODE QUARTER & DATA BULANAN ==============
   Quarter di skema insentif BUKAN kuartal kalender biasa (Q1-Q4), tapi 3 periode
   khusus: Feb-Apr, Mei-Jul, Ags-Okt 2026. Insentif Quarter = tier dicek terhadap
   TOTAL actual 3 bulan dalam periode aktif, bukan actual 1 bulan saja seperti Bulanan.
   Karena tabel utama cuma nyimpen 1 angka actual "berjalan", bulan yang lain (bulan
   sebelumnya dalam periode yang sama) diimport terpisah lewat dropdown "Bulan Import"
   dan disimpan di MONTHLY_DATA tanpa menimpa actual bulan berjalan. */
const ID_MONTHS = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const QUARTER_PERIODS = [
  { key:'feb_apr_2026', label:'Feb - Apr 2026', months:['2026-02','2026-03','2026-04'] },
  { key:'mei_jul_2026', label:'Mei - Jul 2026', months:['2026-05','2026-06','2026-07'] },
  { key:'ags_okt_2026', label:'Ags - Okt 2026', months:['2026-08','2026-09','2026-10'] }
];

function todayMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(monthKey){
  const [y,m] = monthKey.split('-');
  return ID_MONTHS[parseInt(m,10)] + ' ' + y;
}
function getActiveQuarter(){
  const today = todayMonthKey();
  return QUARTER_PERIODS.find(q => q.months.includes(today)) || QUARTER_PERIODS[QUARTER_PERIODS.length-1];
}

let MONTHLY_DATA = { makassar:{}, kendari:{} };
let currentImportMonth = todayMonthKey();

function getMonthlyActual(region, toko, monthKey, catKey){
  const rec = MONTHLY_DATA[region] && MONTHLY_DATA[region][toko] && MONTHLY_DATA[region][toko][monthKey] && MONTHLY_DATA[region][toko][monthKey][catKey];
  if(!rec) return 0;
  return num(rec.ch1) + num(rec.ch2);
}

function setMonthlyValue(region, toko, monthKey, catKey, channelField, val){
  MONTHLY_DATA[region] = MONTHLY_DATA[region] || {};
  MONTHLY_DATA[region][toko] = MONTHLY_DATA[region][toko] || {};
  MONTHLY_DATA[region][toko][monthKey] = MONTHLY_DATA[region][toko][monthKey] || {};
  MONTHLY_DATA[region][toko][monthKey][catKey] = MONTHLY_DATA[region][toko][monthKey][catKey] || { ch1:0, ch2:0 };
  MONTHLY_DATA[region][toko][monthKey][catKey][channelField] = val;
}

function calcQuarterActual(region, row, catKey){
  const quarter = getActiveQuarter();
  const today = todayMonthKey();
  return quarter.months.reduce((sum, m) => {
    if(m === today) return sum + num(row[catKey].ch1) + num(row[catKey].ch2);
    return sum + getMonthlyActual(region, row.toko, m, catKey);
  }, 0);
}

function calcRowIncentiveQuarter(row, catKey, region){
  const reg = region || currentRegion;
  if(catKey === 'all'){
    return Object.keys(QUARTER_INCENTIVE_SCHEME).reduce((sum, key) => {
      return sum + calcIncentiveTiers(tiersForOutlet(key, QUARTER_INCENTIVE_SCHEME, row.toko), calcQuarterActual(reg, row, key));
    }, 0);
  }
  if(!QUARTER_INCENTIVE_SCHEME[catKey]) return 0;
  return calcIncentiveTiers(tiersForOutlet(catKey, QUARTER_INCENTIVE_SCHEME, row.toko), calcQuarterActual(reg, row, catKey));
}

function ensureAllCategories(){
  const catKeys = CATEGORIES.map(c => c.key);
  ['makassar','kendari'].forEach(region => {
    (data[region] || []).forEach(row => {
      catKeys.forEach(k => {
        if(!row[k]) row[k] = { target:0, targetQ:0, ch1:0, ch2:0 };
        // targetQ = target strata untuk periode Quarter (dipisah dari target bulanan)
        if(row[k].targetQ === undefined) row[k].targetQ = 0;
      });
    });
  });
}

function get2026MonthActual(catKey, row, region, monthNum, baseline){
  if(monthNum <= 6) return baseline.m2026[monthNum-1] || 0;
  const monthKey = '2026-' + String(monthNum).padStart(2,'0');
  if(monthKey === todayMonthKey()){
    const c = row[catKey];
    return c ? (num(c.ch1) + num(c.ch2)) : 0;

  const clampedMonths = Math.max(1, Math.min(monthsCount, 12));

  for(let m=1; m<=clampedMonths; m++) sum2026 += get2026MonthActual(catKey, row, region, m, rec);
  const avgYtd2026 = sum2026 / clampedMonths;
  const avg2025 = rec.m2025.reduce((a,b)=>a+b,0) / 12;
  const samePeriod2025Sum = rec.m2025.slice(0, clampedMonths).reduce((a,b)=>a+b,0);
  const avgSamePeriod2025 = samePeriod2025Sum / clampedMonths;
  const growthYtd = avgSamePeriod2025 > 0 ? (avgYtd2026/avgSamePeriod2025 - 1) : null;
  return { avg2025, avgSamePeriod2025, avgYtd2026, growthYtd, monthsCount: clampedMonths, monthLabel: monthLabel('2026-'+String(clampedMonths).padStart(2,'0')) };

      <div class="modal-item-row"><span class="iname">Rata-rata Jan-${b.monthLabel.split(' ')[0]} 2026 (YTD)</span><span class="ival">${fmtItemVal(Math.round(b.avgYtd2026))}</span></div>

}

/* ============== TAB PERFORMANCE (semua toko, semua kategori sekaligus) ==============
   Rekap 1 layar: Avg 2025 & Avg YTD 2026 keseluruhan (kategori ALL) per toko, plus
   growth YTD per kategori (Platinum, Porang, Oil, Milk/Sudia, School, Teen, NS Polos,
   Granola) berdampingan supaya gampang dibandingkan. Growth-nya sama-sama dinamis
   ikut bulan berjalan seperti di modal detail. Milk/Sudia & Granola tidak punya
   growth (Milk gak ada data 2025, Granola gak ada history sama sekali) → tampil "—". */
const PERFORMANCE_GROWTH_COLS = [
  { key:'platinum', label:'Platinum' },
  { key:'porang',   label:'Porang' },
  { key:'oil',      label:'Oil' },
  { key:'milk',     label:'Milk/Sudia' },
  { key:'school',   label:'School' },
  { key:'teen',     label:'Teen' },
  { key:'nspolos',  label:'NS Polos' },
  { key:'granola',  label:'Granola' }
];

function growthCellHtml(growthYtd){
  if(growthYtd === null || growthYtd === undefined) return '<td class="sm-num">&mdash;</td>';
  const txt = (growthYtd>=0?'+':'') + (growthYtd*100).toFixed(1) + '%';
  const cls = growthYtd>=0 ? 'sm-gap-pos' : 'sm-gap-neg';
  return `<td class="sm-num ${cls}">${txt}</td>`;
}

function renderPerformanceTable(skipSubtitle){
  const region = currentRegion;
  const outlets = getOutlets();

  if(!skipSubtitle){
    document.getElementById('subtitle').textContent =
      (region==='makassar' ? 'Makassar' : 'Kendari') + ' · Performance (semua kategori)';
  }

  const thead = document.getElementById('thead');
  const headCols = ['#','Nama Toko','Avg 2025 (ALL)','Avg YTD 2026 (ALL)','Growth YTD (ALL)']
    .concat(PERFORMANCE_GROWTH_COLS.map(c => 'Growth ' + c.label));
  thead.innerHTML = '<tr>' + headCols.map(h=>`<th>${h}</th>`).join('') + '</tr>';

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let sumAvg2025=0, sumAvgYtd2026=0, matchedCount=0;

  outlets.forEach((row, idx) => {
    const overall = calcDynamicBenchmark('all', row, region);
    if(overall){
      sumAvg2025 += overall.avg2025;
      sumAvgYtd2026 += overall.avgYtd2026;
      matchedCount++;
    }
    const tr = document.createElement('tr');
    let cells = `<td>${idx+1}</td><td class="col-name">${row.toko}</td>`;
    if(overall){
      cells += `<td class="sm-num">${fmt(overall.avg2025)}</td>`;
      cells += `<td class="sm-num">${fmt(overall.avgYtd2026)}</td>`;
      cells += growthCellHtml(overall.growthYtd);
    } else {
      cells += `<td class="sm-num">&mdash;</td><td class="sm-num">&mdash;</td><td class="sm-num">&mdash;</td>`;
    }
    PERFORMANCE_GROWTH_COLS.forEach(c => {
      if(c.key === 'milk' || c.key === 'granola'){
        cells += growthCellHtml(null);
      } else {
        const b = calcDynamicBenchmark(c.key, row, region);
        cells += growthCellHtml(b ? b.growthYtd : null);
      }
    });
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });

  const tfoot = document.getElementById('tfoot');
  const avgAvg2025 = matchedCount ? sumAvg2025/matchedCount : 0;
  const avgAvgYtd2026 = matchedCount ? sumAvgYtd2026/matchedCount : 0;
  const overallGrowth = avgAvg2025 > 0 ? (avgAvgYtd2026/avgAvg2025 - 1) : null;
  let footCells = `<td colspan="2" style="text-align:right">RATA-RATA</td><td class="sm-num">${fmt(avgAvg2025)}</td><td class="sm-num">${fmt(avgAvgYtd2026)}</td>`;

  `;
}

/* ============== TAB INSENTIF SPG ==============
   Insentif per orang (SPG), bukan per toko. Satu SPG bisa pegang maks 2 toko
   sekaligus, dengan proporsi "stay" (hari kerja dari total 6 hari/minggu):
     1 toko        → 6/6 = 1.0
     2 toko 3+3    → 0.5 + 0.5
     2 toko 4+2    → 0.667 + 0.333
   Insentif SPG per kategori = jumlah (insentif toko tsb di kategori itu × proporsi
   stay SPG di toko itu), dijumlah dari semua toko yang dia pegang. Dihitung untuk
   Insentif Bulanan MAUPUN Insentif Quarter (mengikuti pengali outlet & strata yang
   sudah ada). Data SPG (nama, toko, hari) disimpan & re-editable, persisten di
   localStorage terpisah dari data penjualan. */
const SPG_TOTAL_DAYS = 6;

function defaultSpgData(){
  return {
    makassar: ['Rhiby Aliyah Pratiwi','Resky Audina','Lilis Suriani','Muliani','Salsa Syabilla Zahra','Yuninda Natasya Amey','Amel','Nadia','Kamalia','A. Etriani','Ike Putri Magfirah']
      .map(name => ({ name, s1:'', h1:SPG_TOTAL_DAYS, s2:'', h2:0 })),
    kendari: ['Andi Sriwahyuni','Yuliana','Nur Alvina Azizah Buburanda','Nabila Febriani']
      .map(name => ({ name, s1:'', h1:SPG_TOTAL_DAYS, s2:'', h2:0 }))
  };
}

let SPG_DATA = null;

function loadSpgData(){
  try{
    const raw = localStorage.getItem('insentif_mpo_spg_v15');
    SPG_DATA = raw ? JSON.parse(raw) : defaultSpgData();
    // migrasi dari nama grup lama (bsp/matakar) ke makassar/kendari
    if(SPG_DATA.bsp && !SPG_DATA.makassar) SPG_DATA.makassar = SPG_DATA.bsp;
    if(SPG_DATA.matakar && !SPG_DATA.kendari) SPG_DATA.kendari = SPG_DATA.matakar;
    delete SPG_DATA.bsp; delete SPG_DATA.matakar;
    if(!SPG_DATA.makassar) SPG_DATA.makassar = [];
    if(!SPG_DATA.kendari) SPG_DATA.kendari = [];
  }catch(e){
    console.error(e);
    SPG_DATA = defaultSpgData();
  }
}

function persistSpg(){
  try{ localStorage.setItem('insentif_mpo_spg_v15', JSON.stringify(SPG_DATA)); }catch(e){ console.error(e); }
}

function updateSpgName(group, idx, value){ SPG_DATA[group][idx].name = value; persistSpg(); }
function updateSpgStore(group, idx, slot, value){ SPG_DATA[group][idx][slot] = value; persistSpg(); render(); }
function updateSpgHari(group, idx, slot, value){
  let v = parseFloat(value); if(isNaN(v)) v = 0;
  v = Math.max(0, Math.min(SPG_TOTAL_DAYS, v));
  SPG_DATA[group][idx][slot] = v;
  persistSpg(); render();
}
function addSpg(group){ SPG_DATA[group].push({ name:'SPG Baru', s1:'', h1:SPG_TOTAL_DAYS, s2:'', h2:0 }); persistSpg(); render(); }
function removeSpg(group, idx){ SPG_DATA[group].splice(idx,1); persistSpg(); render(); }

function spgStoreOptions(outlets, selected){
  return '<option value="">— pilih toko —</option>' +
    outlets.map(o => `<option value="${o.toko}" ${o.toko===selected?'selected':''}>${o.toko}</option>`).join('');
}

function calcSpgIncentive(spg, outlets, region, catKey, quarter){
  const row1 = outlets.find(r => r.toko === spg.s1);
  const row2 = outlets.find(r => r.toko === spg.s2);
  const p1 = (num(spg.h1)||0) / SPG_TOTAL_DAYS;
  const p2 = (num(spg.h2)||0) / SPG_TOTAL_DAYS;
  let val = 0;
  if(row1) val += (quarter ? calcRowIncentiveQuarter(row1, catKey, region) : calcRowIncentive(row1, catKey)) * p1;
  if(row2) val += (quarter ? calcRowIncentiveQuarter(row2, catKey, region) : calcRowIncentive(row2, catKey)) * p2;
  return val;
}

function renderSpgTable(skipSubtitle){
  if(!SPG_DATA) loadSpgData();
  const region = currentRegion;
  const regionLabel = region === 'makassar' ? 'Makassar' : 'Kendari';
  if(!skipSubtitle) document.getElementById('subtitle').textContent = 'Insentif SPG · ' + regionLabel;

  const catCols = CATEGORIES.filter(c => c.key !== 'all');
  const outlets = data[region];
  const spgList = SPG_DATA[region];

  const thead = document.getElementById('thead');
  const leadHeadCols = ['#','Nama SPG','Toko 1','Hari 1 (/6)','Toko 2','Hari 2 (/6)'];
  const bulananHeadCols = catCols.map(c => c.label).concat(['Total Bulanan']);
  const quarterHeadCols = catCols.map(c => c.label).concat(['Total Quarter']);
  thead.innerHTML = '<tr>' +
    leadHeadCols.map(h => `<th>${h}</th>`).join('') +
    `<th colspan="${bulananHeadCols.length}" style="text-align:center;background:var(--card2);">INSENTIF BULANAN</th>` +
    `<th colspan="${quarterHeadCols.length}" style="text-align:center;" class="spg-q-cell">INSENTIF QUARTER (${getActiveQuarter().label})</th>` +
    '<th></th></tr><tr>' +
    leadHeadCols.map(()=>'<th></th>').join('') +
    bulananHeadCols.map(h => `<th>${h}</th>`).join('') +
    quarterHeadCols.map(h => `<th class="spg-q-cell">${h}</th>`).join('') +
    '<th></th></tr>';

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let grandBulanan = 0, grandQuarter = 0;

  spgList.forEach((spg, idx) => {
    let totalBulanan = 0, totalQuarter = 0;
    const bulananVals = catCols.map(cat => {
      const v = calcSpgIncentive(spg, outlets, region, cat.key, false);
      totalBulanan += v;
      return v;
    });
    const quarterVals = catCols.map(cat => {
      const v = calcSpgIncentive(spg, outlets, region, cat.key, true);
      totalQuarter += v;
      return v;
    });
    grandBulanan += totalBulanan;
    grandQuarter += totalQuarter;

    const tr = document.createElement('tr');
    let cells = `<td>${idx+1}</td>`;
    cells += `<td><input type="text" class="target-input" style="min-width:140px" value="${spg.name}" onchange="updateSpgName('${region}',${idx},this.value)"></td>`;
    cells += `<td><select class="spg-store-select" onchange="updateSpgStore('${region}',${idx},'s1',this.value)">${spgStoreOptions(outlets, spg.s1)}</select></td>`;
    cells += `<td><input type="number" min="0" max="${SPG_TOTAL_DAYS}" step="0.5" value="${spg.h1}" style="width:52px" onchange="updateSpgHari('${region}',${idx},'h1',this.value)"></td>`;
    cells += `<td><select class="spg-store-select" onchange="updateSpgStore('${region}',${idx},'s2',this.value)">${spgStoreOptions(outlets, spg.s2)}</select></td>`;
    cells += `<td><input type="number" min="0" max="${SPG_TOTAL_DAYS}" step="0.5" value="${spg.h2}" style="width:52px" onchange="updateSpgHari('${region}',${idx},'h2',this.value)"></td>`;
    bulananVals.forEach(v => { cells += `<td>${fmt(v)}</td>`; });
    cells += `<td style="font-weight:700">${fmt(totalBulanan)}</td>`;
    quarterVals.forEach(v => { cells += `<td class="spg-q-cell">${fmt(v)}</td>`; });
    cells += `<td style="font-weight:700" class="spg-q-cell">${fmt(totalQuarter)}</td>`;
    cells += `<td><button class="edit-btn" onclick="removeSpg('${region}',${idx})" title="Hapus SPG">✕</button></td>`;
    tr.innerHTML = cells;
    tbody.appendChild(tr);
  });

  const addRow = document.createElement('tr');
  addRow.innerHTML = `<td colspan="${6 + (catCols.length+1)*2 + 1}" style="text-align:left">
      <button class="edit-btn" onclick="addSpg('${region}')" style="font-weight:700">+ Tambah SPG ${regionLabel}</button>
    </td>`;
  tbody.appendChild(addRow);

  const tfoot = document.getElementById('tfoot');
  tfoot.innerHTML = `<tr><td colspan="6" style="text-align:right">TOTAL SPG ${regionLabel.toUpperCase()}</td>` +
    catCols.map(()=>'<td></td>').join('') + `<td>${fmt(grandBulanan)}</td>` +
    catCols.map(()=>'<td class="spg-q-cell"></td>').join('') + `<td class="spg-q-cell">${fmt(grandQuarter)}</td><td></td></tr>`;

  const cards = document.getElementById('cards');
  cards.innerHTML = `
    <div class="card"><div class="card-inner"><div class="label">Jumlah SPG ${regionLabel}</div><div class="value">${spgList.length}</div></div></div>
    <div class="card"><div class="card-inner"><div class="label">Total Insentif Bulanan</div><div class="value good">${fmt(grandBulanan)}</div></div></div>
    <div class="card"><div class="card-inner"><div class="label">Total Insentif Quarter</div><div class="value good">${fmt(grandQuarter)}</div></div></div>
  `;
}

function switchRegion(region){
  currentRegion = region;
  document.getElementById('btn-makassar').classList.toggle('active', region==='makassar');

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const b = document.createElement('button');
    let label = cat.label;
    b.textContent = label;
    b.className = cat.key===currentCat ? 'active' : '';
    b.onclick = () => { currentCat = cat.key; renderTabs(); render(); };
    tabs.appendChild(b);
  });
  const perfBtn = document.createElement('button');
  perfBtn.textContent = '📊 PERFORMANCE';
  perfBtn.className = (currentCat === '__performance__' ? 'active' : '') + ' tab-performance';
  perfBtn.onclick = () => { currentCat = '__performance__'; renderTabs(); render(); };
  tabs.appendChild(perfBtn);

  const spgBtn = document.createElement('button');
  spgBtn.textContent = '🧑‍💼 INSENTIF SPG';
  spgBtn.className = (currentCat === '__spg__' ? 'active' : '') + ' tab-performance';
  spgBtn.onclick = () => { currentCat = '__spg__'; renderTabs(); render(); };
  tabs.appendChild(spgBtn);
}

function num(v){ return (v===null || v===undefined || v==='' || isNaN(v)) ? 0 : parseFloat(v); }
function fmt(n){ return Math.round(n).toLocaleString('id-ID'); }
function fmtInput(n){ return Math.round(num(n)).toLocaleString('id-ID'); }
function parseInputNum(v){
  // strip thousand-separator dots, keep only digits and leading minus
  const cleaned = String(v).replace(/\./g,'').replace(/[^0-9\-]/g,'');
  return cleaned === '' ? 0 : parseFloat(cleaned);
}

function pctBadgeClass(pct){
  if(pct >= 100) return 'good';
  if(pct >= 70) return 'warn';
  return 'bad';
}

function getOutlets(){ return data[currentRegion]; }
function getCatConf(){ return CATEGORIES.find(c => c.key === currentCat); }

function startEditTarget(idx){
  const view = document.getElementById('target-view-'+idx);
  const edit = document.getElementById('target-edit-'+idx);
  if(!view || !edit) return;
  view.style.display = 'none';
  edit.style.display = 'inline-block';
  edit.focus();
  edit.select();
}

function finishEditTarget(idx){
  const view = document.getElementById('target-view-'+idx);
  const edit = document.getElementById('target-edit-'+idx);
  if(!view || !edit) return;
  reformatInput(edit);
  view.textContent = edit.value;
  edit.style.display = 'none';
  view.style.display = 'inline';
}

function updateVal(idx, field, value){
  const row = getOutlets()[idx];
  const catObj = row[currentCat];
  catObj[field] = parseInputNum(value);
  persist();
}

function updateTargetStrata(idx, value){
  updateVal(idx, 'target', value);
  render();
}

function updateTargetStrataQ(idx, value){
  updateVal(idx, 'targetQ', value);
  render();
}

function reformatInput(el){
  el.value = fmtInput(el.value);
}

/* ============== STRATA TARGET (Bulanan & Quarter) ==============
   Untuk kategori yang punya skema insentif, Target outlet dipilih dari salah satu
   tier resmi di skema (bukan angka bebas) supaya target selalu selaras dengan level
   insentif. Nilai lama yang tidak cocok tier manapun tetap tampil sebagai "custom".

   Tampilan strata = ladder bertingkat:
     hijau  = strata yang SUDAH tercapai actual
     ungu   = sisa strata menuju target yang dipilih
     abu    = strata di atas target
   Chip "S2/4" = target ada di strata ke-2 dari 4 tingkat yang tersedia. */
function tierListOf(tiers){
  return (tiers || []).map(t => t.threshold);
}

// strata ke berapa (1-based) sebuah nilai berada; 0 = belum/di bawah tier pertama
function strataOf(value, tiers){
  let lvl = 0;
  tiers.forEach((t,i) => { if(num(value) >= t) lvl = i+1; });
  return lvl;
}

// versi ringkas read-only untuk modal: chip strata + ladder mini
function strataBadge(catKey, currentVal, actual, scheme, toko){
  const effTiers = tiersForOutlet(catKey, scheme, toko);
  const tiers = tierListOf(effTiers);
  if(!tiers.length) return '<span class="strata-na">&mdash;</span>';
  const targetLvl = strataOf(currentVal, tiers);
  const earnedLvl = strataOf(actual, tiers);
  const hit = targetLvl > 0 && earnedLvl >= targetLvl;
  const ladder = tiers.map((t,i) => {
    const lvl = i+1;
    let cls = '';
    if(lvl <= earnedLvl) cls = 'earned';
    else if(lvl <= targetLvl) cls = 'toward';
    return `<i class="${cls}"></i>`;
  }).join('');
  return `<span class="strata-mini" title="Target strata ${targetLvl || '–'} dari ${tiers.length} · tercapai ${earnedLvl || '–'}">
      <span class="strata-chip${hit?' hit':''}">${targetLvl ? 'S'+targetLvl : '–'}/${tiers.length}</span>
      <span class="strata-ladder">${ladder}</span>
    </span>`;
}

function strataCellHtml(idx, catKey, currentVal, actual, scheme, handler, toko){
  const effTiers = tiersForOutlet(catKey, scheme, toko);
  const tiers = tierListOf(effTiers);
  if(!tiers.length) return `<span class="strata-na">&mdash;</span>`;

  const cur = num(currentVal);
  const targetLvl = strataOf(cur, tiers);      // strata target yang dipilih
  const earnedLvl = strataOf(actual, tiers);   // strata yang sudah tercapai
  const hit = targetLvl > 0 && earnedLvl >= targetLvl;

  // opsi dropdown: 0 + semua tier resmi (threshold sudah ikut dikalikan pengali
  // outlet kalau ada) + nilai custom kalau ada
  let opts = Array.from(new Set([0, ...tiers]));
  const isCustom = cur !== 0 && !opts.includes(cur);
  if(isCustom) opts.push(cur);
  opts.sort((a,b) => a-b);

  const mult = outletMultiplier(toko);
  const optionsHtml = opts.map(v => {
    let label;
    if(v === 0){
      label = '— belum diset (Rp 0)';
    } else if(v === cur && isCustom){
      label = 'Rp ' + fmt(v) + ' (custom, di luar strata)';
    } else {
      const lvl = tiers.indexOf(v) + 1;
      const inc = (effTiers.find(t => t.threshold === v) || {}).incentive || 0;
      const multTag = mult !== 1 ? ` (×${mult})` : '';
      label = `S${lvl} · Rp ${fmt(v)}${multTag} → insentif Rp ${fmt(inc)}`;
    }
    return `<option value="${v}" ${v===cur?'selected':''}>${label}</option>`;
  }).join('');

  const ladder = tiers.map((t,i) => {
    const lvl = i+1;
    let cls = '';
    if(lvl <= earnedLvl) cls = 'earned';
    else if(lvl <= targetLvl) cls = 'toward';
    return `<i class="${cls}"></i>`;
  }).join('');

  const chip = isCustom ? 'CUSTOM' : (targetLvl === 0 ? `–/${tiers.length}` : `S${targetLvl}/${tiers.length}`);
  const tip = `Target strata ${targetLvl || '–'} dari ${tiers.length} · tercapai sampai strata ${earnedLvl || '–'}` + (mult !== 1 ? ` · target dikalikan ×${mult}` : '');

  return `<div class="strata" title="${tip}" onclick="event.stopPropagation()">
      <select onclick="event.stopPropagation()" onchange="event.stopPropagation(); ${handler}(${idx}, this.value)">${optionsHtml}</select>
      <span class="strata-top">
        <span class="strata-val${cur===0?' zero':''}">${cur===0 ? '—' : fmt(cur)}</span>
        <span class="strata-chip${hit?' hit':''}">${chip}</span>
      </span>
      <span class="strata-ladder">${ladder}</span>
    </div>`;
}

/* BCP cuma pernah dipakai buat ngisi kategori ALL & NS Polos (lihat importBCP).
   Kategori lain (Oil, Porang, Platinum, Milk, School, Teen, Granola) actual-nya
   cuma dari BSP/MATAKAR — jadi kolom BCP disembunyikan supaya tidak nampilin
   kolom yang memang selalu kosong buat kategori-kategori itu. */
function categoryHasBcp(catKey){
  return catKey === 'all' || catKey === 'nspolos';
}

// Oil & Milk (Diabetix)/Sudia tidak punya skema Quarter sama sekali — jadi grup
// kolom Quarter (Total Quarter / Target Quarter / Insentif Quarter) disembunyikan
// sepenuhnya buat kedua kategori ini, bukan cuma ditampilkan sebagai "—".
const HIDE_QUARTER_CATS = ['oil', 'milk', 'nspolos', 'granola'];
function categoryHasQuarter(catKey){
  return !HIDE_QUARTER_CATS.includes(catKey);
}

function render(skipSubtitle){
  if(currentCat === '__performance__'){ renderPerformanceTable(skipSubtitle); return; }
  if(currentCat === '__spg__'){ renderSpgTable(skipSubtitle); return; }
  const region = currentRegion;
  const cat = getCatConf();
  const outlets = getOutlets();
  const ch = REGION_CHANNELS[region];
  const showBcp = categoryHasBcp(cat.key);
  const showQuarter = categoryHasQuarter(cat.key);

  if(!skipSubtitle){
    document.getElementById('subtitle').textContent =
      (region==='makassar' ? 'Makassar' : 'Kendari') + ' · ' +
      cat.label;
  }

  // THEAD — grup Bulanan lalu grup Quarter
  const quarter = getActiveQuarter();
  const thead = document.getElementById('thead');
  let headCols = ['#','Nama Toko', cat.target + (INCENTIVE_SCHEME[cat.key] ? ' (Strata)' : ''), ch.ch1];
  if(showBcp) headCols.push(ch.ch2);
  headCols.push('Total', '% Capaian', 'Insentif Bulanan');
  if(showQuarter) headCols.push(`Total ${quarter.label}`, 'Target Quarter (Strata)', 'Insentif Quarter');
  thead.innerHTML = '<tr>' + headCols.map(h=>`<th>${h}</th>`).join('') + '</tr>';

  // TBODY
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let totalTarget=0, totalActual=0, totalCh1=0, totalCh2=0, pctSum=0, pctCount=0,
      totalIncentive=0, totalIncentiveQ=0, totalActualQ=0;

  outlets.forEach((row, idx) => {
    const c = row[cat.key];
    const target = num(c.target);
    const actual = num(c.ch1) + num(c.ch2);
    const pct = target > 0 ? (actual/target*100) : 0;
    const incentive = calcRowIncentive(row, cat.key);
    const incentiveQ = calcRowIncentiveQuarter(row, cat.key);
    const actualQ = cat.key === 'all' ? 0 : calcQuarterActual(region, row, cat.key);

    totalTarget += target;
    totalActual += actual;
    totalCh1 += num(c.ch1);
    totalCh2 += num(c.ch2);
    totalIncentive += incentive;
    totalIncentiveQ += incentiveQ;
    totalActualQ += actualQ;
    if(target>0){ pctSum += pct; pctCount++; }

    const tr = document.createElement('tr');
    tr.classList.add('clickable');
    if(cat.key === 'all'){
      tr.title = 'Klik untuk lihat ringkasan semua kategori';
      tr.onclick = () => openAllSummary(idx);
    } else {
      tr.title = 'Klik untuk lihat rincian transaksi';
      tr.onclick = () => openDetail(idx);
    }
    let cells = `<td>${idx+1}</td><td class="col-name">${row.toko}</td>`;
    if(INCENTIVE_SCHEME[cat.key]){
      cells += `<td>${strataCellHtml(idx, cat.key, c.target, actual, INCENTIVE_SCHEME, 'updateTargetStrata', row.toko)}</td>`;
    } else {
      cells += `<td>
          <span class="target-view" id="target-view-${idx}">${fmtInput(c.target)}</span>

          <button class="edit-btn" onclick="event.stopPropagation(); startEditTarget(${idx})" title="Edit target">✎</button>
        </td>`;
    }
    cells += `<td>${fmt(c.ch1)}</td>`;
    if(showBcp) cells += `<td>${fmt(c.ch2)}</td>`;
    cells += `<td>${fmt(actual)}</td>`;
    cells += `<td><span class="pct-bar"><span class="pct-fill" style="width:${Math.min(pct,100)}%"></span></span>
              <span class="badge ${pctBadgeClass(pct)}">${pct.toFixed(1)}%</span></td>`;
    const multBadge = outletMultiplier(row.toko) !== 1 ? ` <span class="mult-badge">×${outletMultiplier(row.toko)}</span>` : '';
    cells += `<td>${fmt(incentive)}${multBadge}</td>`;
    // --- grup Quarter ---
    if(showQuarter){
      cells += `<td>${cat.key === 'all' ? '&mdash;' : fmt(actualQ)}</td>`;
      cells += `<td>${strataCellHtml(idx, cat.key, c.targetQ, actualQ, QUARTER_INCENTIVE_SCHEME, 'updateTargetStrataQ', row.toko)}</td>`;
      cells += `<td>${QUARTER_INCENTIVE_SCHEME[cat.key] || cat.key === 'all' ? fmt(incentiveQ) + multBadge : '&mdash;'}</td>`;
    }
    tr.innerHTML = cells;
    tbody.appendChild(tr);

  let footCells = `<td colspan="2" style="text-align:right">TOTAL</td><td>${fmt(totalTarget)}</td><td>${fmt(totalCh1)}</td>`;
  if(showBcp) footCells += `<td>${fmt(totalCh2)}</td>`;

  if(showQuarter) footCells += `<td>${cat.key === 'all' ? '&mdash;' : fmt(totalActualQ)}</td><td></td><td>${fmt(totalIncentiveQ)}</td>`;

    ['Total Actual', fmt(totalActual), true],

    ['Gap', fmt(totalTarget-totalActual), false],
    ['Total Insentif Bulanan', fmt(totalIncentive), true]
  ];
  if(showQuarter) cardDef.push(['Total Insentif Quarter', fmt(totalIncentiveQ), true]);
  cards.innerHTML = cardDef.map(([label,val,good]) => `
    <div class="card"><div class="card-inner">
      <div class="label">${label}</div><div class="value${good?' good':''}">${val}</div>
    </div></div>`).join('');
}

function fmtItemVal(n){
  const sign = n < 0 ? '-' : '';
  return sign + 'Rp ' + Math.round(Math.abs(n)).toLocaleString('id-ID');
}

function renderChannelSection(label, itemsObj){
  const entries = Object.entries(itemsObj || {});
  let html = `<div class="modal-section"><h3>${label}</h3>`;
  if(entries.length === 0){
    html += `<div class="modal-empty">Belum ada data transaksi dari sumber ini.</div>`;
  } else {
    entries.sort((a,b) => b[1]-a[1]);
    let subtotal = 0;
    entries.forEach(([item, val]) => {
      subtotal += val;
      html += `<div class="modal-item-row"><span class="iname">${item}</span><span class="ival">${fmtItemVal(val)}</span></div>`;
    });
    html += `<div class="modal-subtotal"><span>Subtotal ${label}</span><span>${fmtItemVal(subtotal)}</span></div>`;
  }
  html += `</div>`;
  return html;
}

function normName(s){
  return String(s||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}

// Alias nama "Perusahaan" di file BCP yang sudah dikonfirmasi manual sebelumnya —
// dicek lebih dulu sebelum fuzzy match supaya tidak salah gabung / gagal cocok.
const BCP_ALIAS_MAP = {
  makassar: {
    "CV. TOP MODE PERINTIS": "(PR) CV TOP MODE/ P KEMERDEKAAN MAKASSAR",
    "DIAMOND / PT. KAGE DWIJAYA": "PT. KAGE DWIJAYA/JL BOULEVARD NO. 33 DALAM MALL PA",
    "EKTONG.UD": "EKTONG",
    "HENGKY TRANKU  MM": "BAJI PAMAI/ RANGGONG MAKASSAR",
    "SATU SAMA JAYA ABADI HERTASNING  PT": "(PR) PT. SATU SAMA JAYA ABADI / JL LANDAK",
    "SATU SAMA JAYA ABADI PERINTIS  PT": "(PR) SATU SAMA JAYA ABADI PERINTIS",
    "SATU SAMA JAYA ABADI PT": "(PR) PT. SATU SAMA JAYA ABADI",
    "GRAND TOSERBA": "(PR) GRAND TOSERBA/ KOMPLEK RUKO MIRAH (TOSERBA) J",
    "GRAND TOSERBA HERTASNING": "(PR) GRAND BINTANG LESTARI"
    // GELAEL INDOTIM PT dan SATU SAMA KARLINK: dikonfirmasi memang tidak ada di data BCP
  },
  kendari: {
    "Tk. Sanya ( Tn.Jonny Mulyanto )": "SANYA SWALAYAN",
    "Tk. Damai ( CV. SUMBER BERKAT ABADI )": "TOKO DAMAI / JL PEMBANGUNAN ",
    "Tk. Damai 2 ( CV.SUMBER BERKAT ABADI )": "DAMAI 2/JL AHMAD  YANI POROS KENDARI - BANDARA LEP",
    "Alaska": "CV. ALASKA JAYA ABADI/KOTA KOLAKA"
    // Marina Swalayan, The Park Kendari, Top Mandiri Perkasa: dikonfirmasi tidak ada di data BCP
  }
};

// Alias nama outlet BSP (isi dalam kurung) yang beda total dari nama toko di dashboard.
// Nama yang cuma beda spasi/koma/titik otomatis tetap kecocok lewat exact-normalized match,
// jadi di sini cukup yang benar-benar beda kata.
const BSP_ALIAS_MAP = {
  makassar: {
    "SATU SAMA KARLINK": "SATU SAMA KAREBOSI LINK"
  }
};

function findOutletExactBSP(cleanOutletName, region){
  const norm = normName(cleanOutletName);
  const aliasMap = BSP_ALIAS_MAP[region] || {};
  for(const [toko, aliasName] of Object.entries(aliasMap)){
    if(normName(aliasName) === norm){
      const outlet = (data[region] || []).find(r => r.toko === toko);
      if(outlet) return outlet;
    }
  }
  return findOutletExact(cleanOutletName, region);
}

function findOutletByAliasOrFuzzy(perusahaanName, region){
  const norm = normName(perusahaanName);
  const aliasMap = BCP_ALIAS_MAP[region] || {};
  // cek alias yang sudah dikonfirmasi dulu (exact match ke nama alias)
  for(const [toko, aliasName] of Object.entries(aliasMap)){
    if(normName(aliasName) === norm){
      const outlet = (data[region] || []).find(r => r.toko === toko);
      if(outlet) return outlet;
    }
  }
  // fallback: exact match saja (bukan fuzzy substring) — fuzzy substring pernah
  // salah gabung "GRAND TOSERBA" dengan "GRAND TOSERBA DAYA" yang beda toko sama sekali.
  // Outlet baru yang belum ada alias-nya akan 0 dulu; infokan ke chat untuk ditambahkan.
  return findOutletExact(perusahaanName, region);
}

function findOutletExact(customerName, region){
  const norm = normName(customerName);
  const outlets = data[region || currentRegion];
  return outlets.find(r => normName(r.toko) === norm) || null;
}

function findOutletRow(customerName, region){
  const norm = normName(customerName);
  const outlets = data[region || currentRegion];
  // exact normalized match first
  let hit = outlets.find(r => normName(r.toko) === norm);
  if(hit) return hit;
  // substring match: pick the LONGEST matching toko name to avoid short names
  // (e.g. "GRAND TOSERBA") wrongly swallowing similarly-prefixed outlets
  // (e.g. "GRAND TOSERBA HERTASNING", "GRAND TOSERBA DAYA")
  let best = null, bestLen = 0;
  outlets.forEach(r => {
    const rn = normName(r.toko);
    if(rn.length < 4) return;
    if(norm.includes(rn) || rn.includes(norm)){
      const len = Math.min(rn.length, norm.length);
      if(len > bestLen){ bestLen = len; best = r; }
    }
  });
  return best;
}

const U = s => String(s||'').toUpperCase();
const isOilItem = i => U(i).includes('OIL');
const isPorangItem = i => U(i).includes('PORANG');
const isPlatinumItem = i => { const u=U(i); return u.includes('PLATINUM') && (u.includes('HILO')||u.includes('HI LO')||u.includes('HI-LO')); };
const isMilkItem = i => { const u=U(i); return u.includes('DIAB') && u.includes('MILK'); };
const isSchoolItem = i => { const u=U(i); return u.includes('SCHOOL') && (u.includes('HILO')||u.includes('HI LO')||u.includes('HI-LO')); };
const isTeenItem = i => { const u=U(i); return u.includes('TEEN') && (u.includes('HILO')||u.includes('HI LO')||u.includes('HI-LO')); };
const isNsPolosItem = i => { const u=U(i); return u.includes('PLS') && (u.startsWith('NS')||u.startsWith("N'SARI")); };

const CAT_CLASSIFIERS = {
  oil: isOilItem, porang: isPorangItem, platinum: isPlatinumItem,
  milk: isMilkItem, school: isSchoolItem, teen: isTeenItem, nspolos: isNsPolosItem
};

function findHeaderIndex(headerRow, candidates){
  const norm = headerRow.map(h => normName(h));
  for(const cand of candidates){
    const idx = norm.indexOf(normName(cand));
    if(idx !== -1) return idx;
  }
  return -1;
}

function locateColumns(rows, candidateGroups, maxScanRows){
  const scanLimit = Math.min(rows.length, maxScanRows || 10);
  for(let r = 0; r < scanLimit; r++){
    const header = rows[r];
    if(!header || !header.length) continue;
    const idx = {};
    let allFound = true;
    for(const [key, candidates] of Object.entries(candidateGroups)){
      const found = findHeaderIndex(header, candidates);
      idx[key] = found;
      if(found === -1) allFound = false;
    }
    if(allFound) return { headerRow: r, idx };
  }
  return null;
}

/* ============== FALLBACK: BACA DARI PIVOT CACHE ==============
   Kalau file yang diupload adalah pivot table Excel (bukan tabel detail biasa),
   sheet yang kelihatan cuma ringkasan (misalnya per Salesman) dan kolom yang
   dibutuhkan (Outlet/Nama Barang/Netto, dst) tidak ketemu di situ. Tapi Excel
   selalu menyimpan DATA MENTAH di balik pivot itu di dalam file yang sama
   (xl/pivotCache/pivotCacheRecords*.xml) — satu baris transaksi per outlet per
   item, walau tidak ditampilkan di sheet. Fallback ini baca cache itu langsung
   dan menyusunnya jadi tabel [Outlet, Nama Barang, Netto, ...] biasa, supaya
   proses import selanjutnya (klasifikasi kategori, matching outlet) sama persis
   dengan import file biasa. */
function pivotCacheFieldNames(defDoc){
  return [...defDoc.getElementsByTagName('cacheField')].map(f => f.getAttribute('name'));
}

function pivotCacheSharedItems(defDoc, idx){
  const fields = defDoc.getElementsByTagName('cacheField');
  const field = fields[idx];
  if(!field) return null;
  const shared = field.getElementsByTagName('sharedItems')[0];
  if(!shared) return null;
  return [...shared.getElementsByTagName('s')].map(s => s.getAttribute('v'));
}

function pivotCacheDataRows(recDoc, neededIdx, sharedItemsMap){
  const maxIdx = Math.max(...neededIdx);
  const needSet = new Set(neededIdx);
  const rEls = recDoc.getElementsByTagName('r');
  const rows = [];
  for(let ri=0; ri<rEls.length; ri++){
    const children = rEls[ri].children;
    const vals = {};
    for(let ci=0; ci<children.length && ci<=maxIdx; ci++){
      if(!needSet.has(ci)) continue;
      const el = children[ci];
      const tag = el.tagName;
      let val = '';
      if(tag === 'x'){
        const sidx = parseInt(el.getAttribute('v'),10);
        const items = sharedItemsMap[ci];
        val = items ? (items[sidx] || '') : '';
      } else if(tag === 'n'){
        val = parseFloat(el.getAttribute('v'));
      } else if(tag === 's'){
        val = el.getAttribute('v');
      }
      vals[ci] = val;
    }
    rows.push(neededIdx.map(i => vals[i] !== undefined ? vals[i] : ''));
  }
  return rows;
}

function findPivotCacheFiles(wb){
  if(!wb || !wb.files) return null;
  const keys = Object.keys(wb.files);
  const defKey = keys.find(k => /xl\/pivotCache\/pivotCacheDefinition\d*\.xml$/.test(k));
  if(!defKey) return null;
  const suffix = defKey.match(/pivotCacheDefinition(\d*)\.xml$/)[1];
  const recKey = keys.find(k => k === `xl/pivotCache/pivotCacheRecords${suffix}.xml`) ||
                 keys.find(k => /xl\/pivotCache\/pivotCacheRecords\d*\.xml$/.test(k));
  if(!recKey) return null;
  return { defKey, recKey };
}

function entryToText(entry){
  if(entry == null) return '';
  if(typeof entry === 'string') return entry;
  if(entry.content){
    const c = entry.content;
    if(typeof c === 'string') return c;
    return new TextDecoder('utf-8').decode(c);
  }
  return '';
}

function tryExtractPivotRows(wb, candidateGroups){
  try{
    const files = findPivotCacheFiles(wb);
    if(!files) return null;
    const defText = entryToText(wb.files[files.defKey]);
    const recText = entryToText(wb.files[files.recKey]);
    if(!defText || !recText) return null;
    const parser = new DOMParser();
    const defDoc = parser.parseFromString(defText, 'text/xml');
    const fieldNames = pivotCacheFieldNames(defDoc);
    const fieldIdxByKey = {};
    for(const [key, candidates] of Object.entries(candidateGroups)){
      const idx = findHeaderIndex(fieldNames, candidates);
      if(idx === -1) return null; // field ini tidak ada di pivot cache-nya
      fieldIdxByKey[key] = idx;
    }
    const neededIdx = Array.from(new Set(Object.values(fieldIdxByKey))).sort((a,b)=>a-b);
    const sharedItemsMap = {};
    neededIdx.forEach(idx => { sharedItemsMap[idx] = pivotCacheSharedItems(defDoc, idx); });
    const recDoc = parser.parseFromString(recText, 'text/xml');
    const dataRows = pivotCacheDataRows(recDoc, neededIdx, sharedItemsMap);
    const posInRow = {}; // key -> posisi kolom di rows hasil ekstraksi
    neededIdx.forEach((idx, pos) => { posInRow[idx] = pos; });
    const headerRow = neededIdx.map(idx => fieldNames[idx]);
    return { rows: [headerRow, ...dataRows], source: 'pivotCache' };
  }catch(e){
    console.error('Pivot cache fallback gagal:', e);
    return null;
  }
}

function handleImportFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const status = document.getElementById('importStatus');
  status.textContent = 'Memproses...';
  status.className = 'import-status';

  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, { type:'array', bookFiles:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
      if(currentImportSource === 'bsp') importBSP(rows, wb);
      else if(currentImportSource === 'bcp') importBCP(rows, wb);
      else importMatakar(rows, wb);
    }catch(err){
      status.textContent = 'Gagal membaca file: ' + err.message;
      status.className = 'import-status err';
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function importBSP(rows, wb){
  // BSP selalu masuk ke region Makassar, apapun toggle region yang sedang aktif
  const region = 'makassar';
  const status = document.getElementById('importStatus');
  const bspCols = {
    outlet: ['Outlet','NamaOutlet','NamaToko'],
    item: ['NamaBarang','Nama Barang','Nama'],
    netto: ['Netto','Net Sales']
  };
  let loc = locateColumns(rows, bspCols, 60);
  let usedPivotFallback = false;
  if(!loc){
    // Sheet yang tampak cuma pivot ringkasan (mis. per Salesman) — coba baca dari
    // pivot cache mentah di dalam file yang sama.
    const pivot = tryExtractPivotRows(wb, bspCols);
    if(pivot){
      rows = pivot.rows;
      loc = locateColumns(rows, bspCols, 1);
      usedPivotFallback = true;
    }
  }
  if(!loc){
    status.textContent = 'Kolom Outlet/Nama Barang/Netto tidak ditemukan di file ini (baik di sheet maupun di pivot cache) — kirim filenya lewat chat supaya diproses manual.';
    status.className = 'import-status err';
    return;
  }
  const { headerRow, idx } = loc;
  const sums = {};
  const details = {}; // toko -> cat -> {item: total}
  for(let r=headerRow+1; r<rows.length; r++){
    const row = rows[r];
    const outlet = row[idx.outlet], item = row[idx.item], netto = parseFloat(row[idx.netto])||0;
    if(!outlet || !item) continue;
    // BSP outlet format: "1001.G035 (GRAND TOSERBA)" -> ambil isi tanda kurung terakhir,
    // lalu cocokkan EXACT (bukan substring) supaya "GRAND TOSERBA DAYA" / "... HERTASNING"
    // tidak salah tergabung ke outlet "GRAND TOSERBA" yang polos.
    const m = String(outlet).match(/\(([^)]*)\)\s*$/);
    const cleanOutlet = m ? m[1].trim() : outlet;
    const match = findOutletExactBSP(cleanOutlet, region);
    if(!match) continue;
    sums[match.toko] = sums[match.toko] || {all:0,oil:0,porang:0,platinum:0,milk:0,school:0,teen:0,nspolos:0};
    sums[match.toko].all += netto;
    for(const [cat,fn] of Object.entries(CAT_CLASSIFIERS)){
      if(fn(item)){
        sums[match.toko][cat] += netto;
        details[match.toko] = details[match.toko] || {};
        details[match.toko][cat] = details[match.toko][cat] || {};
        details[match.toko][cat][item] = (details[match.toko][cat][item] || 0) + netto;
      }
    }
  }
  applyImportedSums(sums, 'ch1', null, region, currentImportMonth);
  Object.entries(details).forEach(([toko, cats]) => {
    Object.entries(cats).forEach(([cat, items]) => setDetailChannel(region, toko, cat, 'ch1', items));
  });
  const fallbackNote = usedPivotFallback ? ' (dibaca dari pivot cache, sheet-nya cuma pivot ringkasan)' : '';
  status.textContent = `BSP → Makassar (${monthLabel(currentImportMonth)})${fallbackNote}: ${Object.keys(sums).length} toko cocok & diperbarui.`;
  status.className = 'import-status ok';
  switchRegionSilent(region);
}

function importBCP(rows, wb){
  // BCP diproses untuk KEDUA region sekaligus (Makassar & Kendari) dalam satu file
  const status = document.getElementById('importStatus');
  const bcpCols = {
    cabang: ['KeteranganCabang'],
    perusahaan: ['Perusahaan'],
    merek: ['Merek'],
    group1: ['Group1Barang'],
    nama: ['NamaBarang'],
    dpp: ['DPP']
  };
  let loc = locateColumns(rows, bcpCols, 60);
  let usedPivotFallback = false;
  if(!loc){
    const pivot = tryExtractPivotRows(wb, bcpCols);
    if(pivot){
      rows = pivot.rows;
      loc = locateColumns(rows, bcpCols, 1);
      usedPivotFallback = true;
    }
  }
  if(!loc){
    status.textContent = 'Kolom yang dibutuhkan (KeteranganCabang, Perusahaan, Merek, Group1Barang, NamaBarang, DPP) tidak ditemukan di file ini (baik di sheet maupun di pivot cache).';
    status.className = 'import-status err';
    return;
  }
  const { headerRow, idx: idxMap } = loc;
  const idxCabang = idxMap.cabang, idxPerusahaan = idxMap.perusahaan, idxMerek = idxMap.merek,
        idxGroup1 = idxMap.group1, idxNama = idxMap.nama, idxDPP = idxMap.dpp;
  const branchMap = { makassar: 'MAKASSAR OMEGA', kendari: 'KENDARI' };
  const sumsByRegion = { makassar: {}, kendari: {} };
  const detailsByRegion = { makassar: {}, kendari: {} };
  for(let r=headerRow+1; r<rows.length; r++){
    const row = rows[r];
    const cabang = normName(row[idxCabang]);
    let region = null;
    if(cabang === normName(branchMap.makassar)) region = 'makassar';
    else if(cabang === normName(branchMap.kendari)) region = 'kendari';
    if(!region) continue;
    const perusahaan = row[idxPerusahaan];
    if(!perusahaan) continue;
    const match = findOutletByAliasOrFuzzy(perusahaan, region);
    if(!match) continue;
    const dpp = parseFloat(row[idxDPP])||0;
    const merek = row[idxMerek], group1 = U(row[idxGroup1]), nama = row[idxNama];
    const sums = sumsByRegion[region];
    sums[match.toko] = sums[match.toko] || {all:0, nspolos:0};
    sums[match.toko].all += dpp;
    if(merek==='NUTRISARI' && (group1==='TRADITIONAL' || U(nama).includes('PLS'))){
      sums[match.toko].nspolos += dpp;
      const det = detailsByRegion[region];
      det[match.toko] = det[match.toko] || {};
      det[match.toko][nama] = (det[match.toko][nama] || 0) + dpp;
    }
  }
  applyImportedSums(sumsByRegion.makassar, 'ch2', ['all','nspolos'], 'makassar', currentImportMonth);
  applyImportedSums(sumsByRegion.kendari, 'ch2', ['all','nspolos'], 'kendari', currentImportMonth);
  ['makassar','kendari'].forEach(region => {
    Object.entries(detailsByRegion[region]).forEach(([toko, items]) => {
      setDetailChannel(region, toko, 'nspolos', 'ch2', items);
    });
  });
  const nMks = Object.keys(sumsByRegion.makassar).length, nKdi = Object.keys(sumsByRegion.kendari).length;
  const fallbackNoteBcp = usedPivotFallback ? ' (dibaca dari pivot cache)' : '';
  status.textContent = `BCP (${monthLabel(currentImportMonth)})${fallbackNoteBcp}: Makassar ${nMks} toko, Kendari ${nKdi} toko cocok & diperbarui (ALL & NS Polos).`;
  status.className = 'import-status ok';
}

function importMatakar(rows, wb){
  // MATAKAR selalu masuk ke region Kendari, apapun toggle region yang sedang aktif
  const region = 'kendari';
  const status = document.getElementById('importStatus');
  const matakarCols = {
    customer: ['NAMACUSTOMER'],
    nama: ['NAMA'],
    net: ['NET_SALES_MINUS_PPN']
  };
  let loc = locateColumns(rows, matakarCols, 60);
  let usedPivotFallback = false;
  if(!loc){
    const pivot = tryExtractPivotRows(wb, matakarCols);
    if(pivot){
      rows = pivot.rows;
      loc = locateColumns(rows, matakarCols, 1);
      usedPivotFallback = true;
    }
  }
  if(!loc){
    status.textContent = 'Kolom yang dibutuhkan (NAMACUSTOMER, NAMA, NET_SALES_MINUS_PPN) tidak ditemukan di file ini (baik di sheet maupun di pivot cache).';
    status.className = 'import-status err';
    return;
  }
  const { headerRow, idx: idxMap } = loc;
  const idxCustomer = idxMap.customer, idxNama = idxMap.nama, idxNet = idxMap.net;
  const sums = {};
  const details = {};
  for(let r=headerRow+1; r<rows.length; r++){
    const row = rows[r];
    const customer = row[idxCustomer], item = row[idxNama], net = parseFloat(row[idxNet])||0;
    if(!customer || !item) continue;
    const match = findOutletRow(customer, region);
    if(!match) continue;
    sums[match.toko] = sums[match.toko] || {all:0,oil:0,porang:0,platinum:0,milk:0,school:0,teen:0};
    sums[match.toko].all += net;
    for(const cat of ['oil','porang','platinum','milk','school','teen']){
      if(CAT_CLASSIFIERS[cat](item)){
        sums[match.toko][cat] += net;
        details[match.toko] = details[match.toko] || {};
        details[match.toko][cat] = details[match.toko][cat] || {};
        details[match.toko][cat][item] = (details[match.toko][cat][item] || 0) + net;
      }
    }
  }
  applyImportedSums(sums, 'ch1', null, region, currentImportMonth);
  Object.entries(details).forEach(([toko, cats]) => {
    Object.entries(cats).forEach(([cat, items]) => setDetailChannel(region, toko, cat, 'ch1', items));
  });
  const fallbackNoteMtk = usedPivotFallback ? ' (dibaca dari pivot cache)' : '';
  status.textContent = `MATAKAR → Kendari (${monthLabel(currentImportMonth)})${fallbackNoteMtk}: ${Object.keys(sums).length} toko cocok & diperbarui (kecuali NS Polos).`;
  status.className = 'import-status ok';
  switchRegionSilent(region);
}

function setDetailChannel(region, toko, cat, channelField, itemsObj){
  DETAIL_DATA[region] = DETAIL_DATA[region] || {};
  DETAIL_DATA[region][toko] = DETAIL_DATA[region][toko] || {};
  DETAIL_DATA[region][toko][cat] = DETAIL_DATA[region][toko][cat] || { ch1:{}, ch2:{} };
  DETAIL_DATA[region][toko][cat][channelField] = itemsObj; // replace, bukan tambah
}

function applyImportedSums(sums, channelField, onlyCats, region, monthKey){
  const reg = region || currentRegion;
  const outlets = data[reg];
  const month = monthKey || currentImportMonth || todayMonthKey();
  const isCurrentMonth = month === todayMonthKey();
  outlets.forEach(row => {
    const s = sums[row.toko];
    if(!s) return;
    const cats = onlyCats || ['all','oil','porang','platinum','milk','school','teen','nspolos'];
    cats.forEach(cat => {
      if(s[cat] !== undefined){
        const val = Math.round(s[cat]*100)/100;
        setMonthlyValue(reg, row.toko, month, cat, channelField, val);
        if(isCurrentMonth) row[cat][channelField] = val;
      }
    });
  });
  persist();
  render();
}

function switchRegionSilent(region){
  // Pindah tampilan ke region tujuan import, tanpa perlu diklik manual
  if(currentRegion !== region) switchRegion(region);
  else render();
}
